services:
  jumat-berkah-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
    container_name: jumat-berkah-app
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      # Uploaded expense receipts and distribution photos are written to
      # /app/public/uploads at runtime. Without a volume they live in the
      # container filesystem and disappear on every recreate/deploy.
      - jumat_berkah_uploads:/app/public/uploads
    depends_on:
      jumat-berkah-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jumat-berkah-network

  jumat-berkah-postgres:
    image: postgres:16-alpine
    container_name: jumat-berkah-postgres
    environment:
      POSTGRES_DB: jumat_berkah
      POSTGRES_USER: jumat_berkah_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - jumat_berkah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumat_berkah_user -d jumat_berkah"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jumat-berkah-network

volumes:
  jumat_berkah_postgres_data:
    name: jumat_berkah_postgres_data
  jumat_berkah_uploads:
    name: jumat_berkah_uploads

networks:
  jumat-berkah-network:
    name: jumat-berkah-network
