<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4e9"/>
      <stop offset="55%" stop-color="#eef3e8"/>
      <stop offset="100%" stop-color="#dce8d5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d4b34"/>
      <stop offset="100%" stop-color="#17724e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#123b2c" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font-family:Georgia,serif;font-weight:700;letter-spacing:6px;fill:#0d4b34}
      .sans{font-family:Arial,Helvetica,sans-serif;fill:#21372d}
      .small{font-size:28px}.medium{font-size:42px}.large{font-size:82px}
      .white{fill:#fff}.cream{fill:#fff8e9}.greenText{fill:#0d4b34}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- decorative mosque silhouette -->
  <g opacity="0.10" fill="#0d4b34">
    <rect x="55" y="1050" width="970" height="26"/>
    <path d="M510 1045 C510 970 570 935 610 935 C650 935 710 970 710 1045Z"/>
    <path d="M260 1048 C260 990 305 965 340 965 C375 965 420 990 420 1048Z"/>
    <path d="M770 1048 C770 990 815 965 850 965 C885 965 930 990 930 1048Z"/>
    <rect x="118" y="860" width="42" height="205" rx="12"/><circle cx="139" cy="842" r="33"/>
    <rect x="930" y="860" width="42" height="205" rx="12"/><circle cx="951" cy="842" r="33"/>
  </g>

  <!-- header -->
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="940" height="260" rx="38" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="470" y="85" text-anchor="middle" class="title large">JUMAT</text>
    <text x="470" y="170" text-anchor="middle" class="title large">BERKAH</text>
    <text x="470" y="220" text-anchor="middle" class="sans small greenText">Berbagi Nasi • Berbagi Rezeki • Berbagi Kebahagiaan</text>
  </g>

  <!-- main illustration card -->
  <g transform="translate(70 390)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="920" rx="44" fill="#fffdf5"/>
    <rect x="0" y="0" width="940" height="920" rx="44" fill="none" stroke="#d9c99a" stroke-width="4"/>

    <!-- street/mosque background -->
    <rect x="0" y="610" width="940" height="310" rx="0" fill="#d5c4a1" opacity="0.5"/>
    <path d="M0 605 C220 560 420 610 620 565 C760 535 840 560 940 535 L940 920 L0 920Z" fill="#b6c59e" opacity="0.6"/>
    <rect x="70" y="70" width="800" height="250" rx="24" fill="#e8e1cf"/>
    <path d="M110 320 L830 320 L770 160 L170 160Z" fill="#c8b487"/>
    <rect x="205" y="190" width="130" height="130" rx="16" fill="#f9f6eb"/>
    <rect x="475" y="190" width="130" height="130" rx="16" fill="#f9f6eb"/>
    <path d="M395 320 C395 245 470 215 540 320Z" fill="#f9f6eb"/>
    <rect x="118" y="105" width="44" height="215" fill="#d3c29e"/>
    <rect x="778" y="105" width="44" height="215" fill="#d3c29e"/>

    <!-- donation table -->
    <rect x="115" y="575" width="710" height="58" rx="12" fill="#9b7148"/>
    <rect x="150" y="630" width="34" height="130" fill="#7c5735"/>
    <rect x="760" y="630" width="34" height="130" fill="#7c5735"/>

    <!-- donation box -->
    <rect x="390" y="438" width="230" height="140" rx="12" fill="#e9f3ee" stroke="#0d4b34" stroke-width="6"/>
    <rect x="435" y="420" width="140" height="22" rx="8" fill="#0d4b34"/>
    <text x="505" y="493" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#0d4b34">KOTAK</text>
    <text x="505" y="532" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#0d4b34">DONASI</text>

    <!-- food items -->
    <g>
      <rect x="210" y="510" width="115" height="54" rx="12" fill="#ffffff" stroke="#d7d7d7"/>
      <rect x="660" y="515" width="115" height="54" rx="12" fill="#ffffff" stroke="#d7d7d7"/>
      <rect x="125" y="490" width="70" height="100" rx="20" fill="#e2a735"/>
      <rect x="127" y="485" width="66" height="20" rx="8" fill="#f3d771"/>
      <rect x="720" y="480" width="68" height="105" rx="20" fill="#e2a735"/>
      <rect x="722" y="475" width="64" height="20" rx="8" fill="#f3d771"/>
      <rect x="625" y="465" width="72" height="110" rx="16" fill="#d74633"/>
      <rect x="625" y="510" width="72" height="35" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- people simplified -->
    <!-- volunteer woman -->
    <g transform="translate(95 330)">
      <circle cx="70" cy="70" r="58" fill="#e8c6a5"/>
      <path d="M18 76 C10 25 55 -20 106 15 C145 42 130 118 92 148 C60 170 18 135 18 76Z" fill="#d9c7b0"/>
      <rect x="22" y="130" width="112" height="195" rx="34" fill="#173b31"/>
      <rect x="-4" y="155" width="160" height="145" rx="24" fill="#d9c7b0"/>
      <rect x="14" y="188" width="126" height="28" rx="8" fill="#0d4b34"/>
      <text x="77" y="209" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">RELAWAN</text>
    </g>

    <!-- volunteer man giving food -->
    <g transform="translate(310 260)">
      <circle cx="110" cy="80" r="55" fill="#d69b71"/>
      <rect x="57" y="18" width="106" height="50" rx="6" fill="#070707"/>
      <rect x="45" y="132" width="135" height="260" rx="35" fill="#102d28"/>
      <rect x="25" y="150" width="175" height="180" rx="28" fill="#d1bb94"/>
      <rect x="58" y="190" width="105" height="30" rx="8" fill="#0d4b34"/>
      <text x="110" y="212" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">RELAWAN</text>
      <path d="M170 235 C250 245 300 270 340 295" stroke="#d69b71" stroke-width="36" stroke-linecap="round" fill="none"/>
      <rect x="306" y="258" width="120" height="58" rx="12" fill="#ffffff" stroke="#d7d7d7"/>
    </g>

    <!-- recipient -->
    <g transform="translate(710 305)">
      <circle cx="78" cy="78" r="52" fill="#bf835c"/>
      <rect x="25" y="35" width="112" height="38" rx="8" fill="#111"/>
      <rect x="25" y="132" width="128" height="275" rx="34" fill="#7b827a"/>
      <path d="M35 220 C-30 220 -65 230 -105 285" stroke="#bf835c" stroke-width="32" stroke-linecap="round" fill="none"/>
    </g>

    <!-- queue people -->
    <g transform="translate(765 335)" opacity="0.95">
      <g transform="translate(0 0)"><circle cx="80" cy="70" r="42" fill="#c28b65"/><rect x="40" y="118" width="95" height="200" rx="28" fill="#ffffff"/><rect x="38" y="32" width="86" height="35" rx="7" fill="#202020"/></g>
      <g transform="translate(60 35)"><circle cx="95" cy="70" r="38" fill="#b77d55"/><rect x="55" y="115" width="90" height="190" rx="28" fill="#6d7d4b"/><rect x="57" y="35" width="78" height="34" rx="7" fill="#222"/></g>
    </g>
  </g>

  <!-- distribution panels -->
  <g transform="translate(70 1360)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="315" rx="38" fill="#ffffff"/>
    <text x="470" y="58" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#0d4b34">Penyaluran Jumat Berkah</text>
    <g transform="translate(55 92)">
      <circle cx="65" cy="65" r="46" fill="#e0b18b"/><rect x="20" y="115" width="95" height="118" rx="28" fill="#0e332b"/><rect x="6" y="110" width="120" height="72" rx="18" fill="#d4bf98"/>
      <rect x="155" y="78" width="135" height="70" rx="14" fill="#fff" stroke="#cfcfcf"/>
      <path d="M110 140 C150 125 168 120 190 108" stroke="#e0b18b" stroke-width="24" stroke-linecap="round"/>
      <circle cx="365" cy="65" r="45" fill="#b9825b"/><rect x="318" y="112" width="110" height="122" rx="30" fill="#405747"/><path d="M315 65 C315 18 360 0 405 28 C430 45 425 100 392 124 C355 144 318 112 315 65Z" fill="#24382f"/>
      <text x="245" y="218" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0d4b34">Makanan Siap Santap</text>
    </g>
    <g transform="translate(545 92)">
      <circle cx="70" cy="64" r="45" fill="#c08d68"/><rect x="22" y="110" width="110" height="125" rx="28" fill="#efefef"/><rect x="24" y="30" width="92" height="34" rx="7" fill="#1d1d1d"/>
      <path d="M122 140 C165 130 205 120 250 105" stroke="#c08d68" stroke-width="24" stroke-linecap="round"/>
      <path d="M235 93 L365 93 L340 170 L210 170Z" fill="#f4f0df" stroke="#b99d65" stroke-width="4"/>
      <text x="287" y="142" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0d4b34">BERAS</text>
      <circle cx="405" cy="70" r="42" fill="#9f6b4d"/><rect x="360" y="115" width="98" height="120" rx="27" fill="#c9652f"/><rect x="372" y="30" width="78" height="34" rx="7" fill="#5c5c5c"/>
      <text x="280" y="218" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0d4b34">Sembako Untuk Warga</text>
    </g>
  </g>

  <!-- footer CTA -->
  <g transform="translate(0 1760)">
    <rect x="0" y="0" width="1080" height="160" fill="url(#green)"/>
    <text x="540" y="58" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff8e9">Niatkan Karena Allah • Berbagi Dengan Ikhlas • Bahagiakan Sesama</text>
    <text x="540" y="122" text-anchor="middle" font-family="Georgia" font-size="54" font-style="italic" fill="#fff8e9">Jumat Berkah, Hidup Penuh Berkah</text>
  </g>
</svg>
